# GitLab CI Performance Testing Configuration
#
# Copy the relevant jobs into your .gitlab-ci.yml.
# Customize variables, test paths, and runner tags for your project.
#
# Prerequisites:
#   - A GitLab Runner with consistent resources for perf testing
#     (see references/gitlab-ci-integration.md "Runner Options")
#     Contact #g_performance_enablement for provisioning guidance
#   - CI variables: PERF_ENV_URL, PERF_PRIVATE_TOKEN
#   - k6 test files in tests/performance/
#   - sitespeed.io budget file at budget.json (repo root)
#
# IMPORTANT: NEVER point PERF_ENV_URL at staging or production.
# Performance tests can take environments offline.

stages:
  - test
  - performance

# ─── k6 Smoke Test (runs on every MR) ────────────────────────────────────────
# Lightweight: 1-5 VUs, 30s duration. Catches regressions early.
# Fails the pipeline if thresholds are breached.
perf_smoke:
  stage: test
  image:
    name: grafana/k6:1.6.0
    entrypoint: ['']
  script:
    - k6 run
        --env BASE_URL=${PERF_ENV_URL}
        --env PRIVATE_TOKEN=${PERF_PRIVATE_TOKEN}
        --summary-export=summary.json
        tests/performance/smoke.js
  artifacts:
    paths:
      - summary.json
    reports:
      load_performance: summary.json
    when: always
    expire_in: 30 days
  rules:
    - if: $CI_MERGE_REQUEST_IID
  tags:
    - your-perf-runner-tag  # Replace with your runner's tag

# ─── k6 Baseline Load Test (scheduled, non-blocking) ─────────────────────────
# Full load profile: target RPS, 5-10 min duration.
# Runs twice consecutively for reliability (k6 recommendation).
# Does NOT block pipeline - investigate consecutive failures.
perf_load:
  stage: performance
  image:
    name: grafana/k6:1.6.0
    entrypoint: ['']
  script:
    - echo "Run 1 of 2"
    - k6 run
        --env BASE_URL=${PERF_ENV_URL}
        --env PRIVATE_TOKEN=${PERF_PRIVATE_TOKEN}
        --summary-export=summary-run1.json
        tests/performance/load.js
    - echo "Run 2 of 2"
    - k6 run
        --env BASE_URL=${PERF_ENV_URL}
        --env PRIVATE_TOKEN=${PERF_PRIVATE_TOKEN}
        --summary-export=summary-run2.json
        tests/performance/load.js
  artifacts:
    paths:
      - summary-run1.json
      - summary-run2.json
    when: always
    expire_in: 90 days
  # If running on shared runners (temporary), uncomment the next line:
  # allow_failure: true  # TODO: Migrate to dedicated runner (contact #g_performance_enablement)
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  tags:
    - your-perf-runner-tag  # Replace with your runner's tag

# ─── sitespeed.io Frontend Budget (runs on MR with frontend changes) ─────────
# Measures Core Web Vitals against budget thresholds.
# Fails the pipeline if budget is exceeded.
frontend_perf:
  stage: test
  image:
    name: sitespeedio/sitespeed.io:39.4.2
    entrypoint: ['']
  script:
    - /start.sh
      --budget.configPath /sitespeed.io/budget.json
      --budget.output junit
      -c cable
      --browsertime.connectivity.engine throttle
      -n 5
      -b chrome
      ${PERF_ENV_URL}
  artifacts:
    paths:
      - sitespeed-result/
    reports:
      junit: sitespeed-result/**/junit.xml
    when: always
    expire_in: 30 days
  rules:
    - if: $CI_MERGE_REQUEST_IID
      changes:
        - app/views/**/*
        - app/assets/**/*
        - app/javascript/**/*
  tags:
    - your-perf-runner-tag  # Replace with your runner's tag
